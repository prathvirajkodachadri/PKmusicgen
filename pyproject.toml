[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midi-to-python"
version = "0.1.0"
description = "Convert MIDI files into executable Python scripts using Mido"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "midi-to-python contributors" }]
keywords = ["midi", "music", "mido", "converter", "python", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "mido>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/prathvirajkodachadri/PKmusicgen"
Repository = "https://github.com/prathvirajkodachadri/PKmusicgen"
Issues = "https://github.com/prathvirajkodachadri/PKmusicgen/issues"

[project.scripts]
midi-to-python = "midi2python.cli:main"
midi2python = "midi2python.cli:main"

[tool.setuptools.packages.find]
include = ["midi2python*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
