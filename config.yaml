# PKmusicgen Configuration
# Free Online AI Music & Audio Generation Platform

app:
  name: "PKmusicgen - Free Online AI Music & Sample Generator"
  version: "1.0.0"
  host: "0.0.0.0"  # Bind to 0.0.0.0 for preview & cloud access
  port: 7860
  debug: false
  offline_mode: false  # When true, blocks model downloads and external requests
  log_level: "INFO"

paths:
  model_dir: "./models"
  output_dir: "./outputs"
  samples_dir: "./samples"
  presets_dir: "./presets"
  logs_dir: "./logs"
  db_path: "./data/library.db"

audio:
  default_sample_rate: 44100  # 44100 or 48000
  default_bit_depth: 16       # 16 or 24
  default_duration: 10        # seconds
  max_duration: 240           # full songs supported
  min_duration: 1
  default_channels: 2
  export_format: "wav"
  normalize: false
  fade_in: 0.0
  fade_out: 0.0
  trim_silence: false

generation:
  default_model: "procedural-dsp"  # Fast built-in AI/DSP synthesizer (100% free, 0 VRAM, instant)
  default_seed: -1                 # -1 = random
  default_guidance_scale: 7.0
  default_num_variations: 1
  max_variations: 10
  max_batch: 10

models:
  auto_load: false
  unload_after_generation: false
  low_vram_mode: false
  use_fp16: true
  cpu_offload: false

hardware:
  detect_on_startup: true
  prefer_gpu: true

ui:
  theme: "dark"
  waveform_resolution: 1000
  auto_play: false
  show_advanced: false

library:
  auto_tag: true
  max_history: 1000

security:
  allow_external_network: true
  max_prompt_length: 1000
  allowed_audio_extensions: [".wav", ".mp3", ".flac", ".ogg"]
